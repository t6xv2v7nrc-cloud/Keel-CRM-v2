<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .mark { fill: #2E6A4D; }
    .eye { fill: #F8F6F2; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #5DAA80; }
      .eye { fill: #1C1B19; }
    }
  </style>
  <g transform="rotate(45 16 16)">
    <rect class="mark" x="5" y="5" width="22" height="22" rx="4.5"/>
    <rect class="eye" x="12" y="12" width="8" height="8" rx="1.6"/>
  </g>
</svg>
